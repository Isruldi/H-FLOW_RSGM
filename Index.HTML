<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>H-FLOW RSGM Unimus</title>
    <style>
        /* Memaksa tampilan 100% layar tanpa sisa margin/border */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f8fafc; }
        iframe { border: none; width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    <iframe id="app-frame"></iframe>

    <script>
        // 1. Menangkap otomatis parameter Unit & Modul dari QR Code yang di-scan
        const urlParams = window.location.search;
        
        // 2. Link Master Apps Script Anda yang bersih (Ganti jika ada URL baru)
        const scriptUrl = "https://script.google.com/macros/s/AKfycbyfbcGEQ1zyfqWARkekEbLZJ-Po92QGEbvaNucdZ7sElVJXGWm6F8Nm2_-WGYEyMbjwBg/exec";
        
        // 3. Memaksa Iframe membuka link Apps Script beserta parameternya
        document.getElementById('app-frame').src = scriptUrl + urlParams;
    </script>
</body>
</html>
